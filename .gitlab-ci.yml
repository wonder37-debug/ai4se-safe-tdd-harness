# 通过南大镜像站 docker.nju.edu.cn 代理拉取 Docker Hub 官方镜像，避免校园网直连 Docker Hub 限流/阻断
image: docker.nju.edu.cn/library/python:3.12-slim

# 共享 runner 偶发系统故障（作业 0 秒无日志失败）时自动重试，最多 2 次
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - test
  - build

unit-test:
  stage: test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install uv
  script:
    - uv sync --frozen
    - uv run ruff check src/safefix tests
    - uv run pytest tests/unit --cov=safefix --cov-report=term --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths:
      - coverage.xml
    expire_in: 1 week

# 打包校验：确保 Python 分发产物可构建（沙箱集成测试在 GitHub Actions 的 Docker runner 上执行）
package-build:
  stage: build
  before_script:
    - pip install uv
  script:
    - uv build
    - test -n "$(ls dist/*.whl)"