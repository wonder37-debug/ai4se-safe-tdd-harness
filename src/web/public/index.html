<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI4SE-Safe-TDD-Harness</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <!-- ───────── 左侧控制栏 ───────── -->
    <aside class="sidebar" aria-label="控制栏">
      <header class="brand">
        <h1 class="wordmark">AI4SE<span class="dot">·</span>Safe-TDD-Harness</h1>
        <p class="brand-sub">self-coded agent kernel</p>
      </header>

      <section class="block">
        <h2 class="eyebrow">任务</h2>
        <p class="hint">描述要 agent 完成的编码任务，指定工作区目录后启动循环。</p>
        <label class="field">
          <span class="field-label">任务描述</span>
          <textarea id="task" rows="4" placeholder="例如：实现 add(a,b) 返回两数之和，并用 Jest 验证">实现 add(a,b) 返回两数之和，并用 Jest 验证</textarea>
        </label>
        <label class="field">
          <span class="field-label">工作区目录</span>
          <input id="cwd" placeholder="/workspace">
        </label>
        <button id="start" class="btn btn--primary">启动循环</button>
      </section>

      <section class="block">
        <h2 class="eyebrow">凭据</h2>
        <label class="field">
          <span class="field-label">主密码</span>
          <input id="master" type="password" placeholder="解锁加密凭据">
        </label>
        <label class="field">
          <span class="field-label">CLAUDE_API_KEY</span>
          <input id="apikey" type="password" placeholder="永不回显，AES-256-GCM 落盘">
        </label>
        <button id="setkey" class="btn">保存 Key</button>
        <p class="keystatus" id="keystatus">key 状态：未知</p>
      </section>
    </aside>

    <!-- ───────── 右侧主舞台（与左侧控制栏同型卡片，顶端绝对对齐） ───────── -->
    <main class="canvas" aria-label="主舞台">
      <!-- 顶部纤细的 Loop State 轨道：用字重与淡化映射当前状态 -->
      <div class="canvas-head">
        <ol class="state-rail" id="stateRail" aria-label="loop state">
          <li data-state="RUNNING"><span class="dot"></span>RUNNING</li>
          <li data-state="APPROVAL_PENDING"><span class="dot"></span>PENDING</li>
          <li data-state="EXECUTING"><span class="dot"></span>EXECUTING</li>
          <li data-state="HALTED"><span class="dot"></span>HALTED</li>
        </ol>
        <span class="iter" id="iterCounter">iter 0</span>
      </div>

      <!-- 人工审批区（无待审批时折叠为安静提示） -->
      <section class="approvals" id="approvals" aria-live="polite"></section>

      <!-- 自然语言事件流 -->
      <div class="stream-head">
        <h2 class="eyebrow">事件流</h2>
        <button id="clearEvents" class="btn btn--ghost">清空</button>
      </div>
      <ol class="stream" id="events" aria-live="polite">
        <li class="event event--empty">等待事件……提交任务后，这里会以自然语言实时流出 agent 的每一步。</li>
      </ol>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
