[project]
name = "safefix"
version = "0.1.0"
description = "AI4SE SafeFix - a test-driven, sandboxed Python coding agent for automated bug repair in Git repositories"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]

[project.scripts]
safefix = "safefix.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safefix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "integration: tests that need external resources (docker / live LLM); skipped by default unless enabled",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/safefix"]