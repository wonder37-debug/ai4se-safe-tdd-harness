id: binary-search-absent
title: "find_first() returns an index for absent targets"
language: python
framework: pytest
license: MIT (original fixture written for SafeFix)
defect_class: incorrect boundary handling / missing equality check
issue: |
  searchkit/bisect.py implements binary search returning the FIRST index of
  target in a sorted list, or -1 when absent. Currently an absent target that
  falls inside the value range returns the insertion point instead of -1
  (e.g. find_first([1,3,5], 4) returns 2). Fix the implementation. Do not
  modify the tests.
repro_command: "python -m pytest -q tests/test_bisect.py"
test_command: "python -m pytest -q"
setup: []
budget:
  max_llm_calls: 12
  max_steps: 24
  max_wall_seconds: 300