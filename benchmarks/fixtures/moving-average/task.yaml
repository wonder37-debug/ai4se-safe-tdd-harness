id: moving-average-last-window
title: "moving_average() drops the final window"
language: python
framework: pytest
license: MIT (original fixture written for SafeFix)
defect_class: off-by-one / incorrect data processing
issue: |
  statskit/average.py computes the simple moving average with a fixed window.
  For n values and window w it must return n - w + 1 averages, but the last
  window is missing (e.g. moving_average([1,2,3], 2) returns [1.5] instead of
  [1.5, 2.5]). Fix the implementation. Do not modify the tests.
repro_command: "python -m pytest -q tests/test_average.py"
test_command: "python -m pytest -q"
setup: []
budget:
  max_llm_calls: 12
  max_steps: 24
  max_wall_seconds: 300