name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src/safefix tests
      - run: uv run ruff format --check src/safefix tests
      - run: uv run pytest tests/unit --cov=safefix --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  sandbox-integration:
    needs: unit-test
    runs-on: ubuntu-latest # GitHub runners ship a running Docker daemon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: docker build -t safefix-sandbox:latest .
      # Live-LLM test self-skips (NOT RUN) without credentials; sandbox tests run.
      - run: uv run pytest tests/integration -m integration -v