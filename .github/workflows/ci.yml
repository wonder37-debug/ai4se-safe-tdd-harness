name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src/safefix tests
      - run: uv run ruff format --check src/safefix tests
      - name: Unit tests (failures surfaced as annotations)
        run: |
          set +e
          uv run pytest tests/unit --cov=safefix --cov-report=xml -v --tb=short 2>&1 | tee pytest-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^FAILED|^ERROR" pytest-output.log | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 80 pytest-output.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            pytest-output.log
          retention-days: 7

  sandbox-integration:
    needs: unit-test
    runs-on: ubuntu-latest # GitHub runners ship a running Docker daemon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: docker build -t safefix-sandbox:latest .
      # Live-LLM test self-skips (NOT RUN) without credentials; sandbox tests run.
      - name: Sandbox integration (failures surfaced as annotations)
        run: |
          set +e
          uv run pytest tests/integration -m integration -v --tb=short 2>&1 | tee pytest-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^FAILED|^ERROR" pytest-output.log | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 80 pytest-output.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"